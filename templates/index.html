<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapInsta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f0f12; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .app-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }

    .camera-box { position: relative; width: 100%; height: 320px; background: #000; border-radius: 18px; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { display: none; }

    .controls { display: flex; flex-direction: column; gap: 10px; background: #1a1a24; padding: 12px; border-radius: 14px; }
    .toggle-group { display: flex; gap: 8px; }
    .toggle-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: #bbb; cursor: pointer; font-weight: bold; }
    .toggle-btn.active { background: #6366f1; color: white; border-color: #6366f1; }

    input[type="text"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; }
    .btn-capture { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #10b981; color: #fff; font-weight: bold; cursor: pointer; }

    .feed { display: flex; flex-direction: column; gap: 16px; }
    .card { background: #181820; border-radius: 14px; overflow: hidden; border: 1px solid #282836; }
    .card-badge { padding: 6px 12px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .badge-snap { background: #eab308; color: #000; }
    .badge-post { background: #ec4899; color: #fff; }
    .card img { width: 100%; max-height: 380px; object-fit: cover; }
    .card-body { padding: 10px 12px; }
    .caption { font-size: 14px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="app-container">
    <h2>SnapInsta 📸</h2>

    <div class="camera-box">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <div class="toggle-group">
        <button type="button" class="toggle-btn active" id="btnModeSnap" onclick="setMode('snap')">⚡ Snap (60s Expire)</button>
        <button type="button" class="toggle-btn" id="btnModePost" onclick="setMode('post')">🖼️ Permanent Post</button>
      </div>
      <input type="text" id="captionInput" placeholder="Add a caption..." />
      <button class="btn-capture" onclick="captureAndUpload()">Capture & Share</button>
    </div>

    <h3>Feed</h3>
    <div class="feed" id="feedContainer"></div>
  </div>

  <script>
    let selectedMode = 'snap';
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { alert("Camera allow karna padega: " + err); });

    function setMode(mode) {
      selectedMode = mode;
      document.getElementById('btnModeSnap').classList.toggle('active', mode === 'snap');
      document.getElementById('btnModePost').classList.toggle('active', mode === 'post');
    }

    async function captureAndUpload() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = canvas.toDataURL('image/jpeg', 0.8);
      const caption = document.getElementById('captionInput').value;

      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageData, type: selectedMode, caption: caption })
      });

      if (res.ok) {
        document.getElementById('captionInput').value = '';
        loadFeed();
      }
    }

    async function loadFeed() {
      const res = await fetch('/api/feed');
      const data = await res.json();
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        const isSnap = item.type === 'snap';
        card.innerHTML = `
          <div class="card-badge ${isSnap ? 'badge-snap' : 'badge-post'}">
            ${isSnap ? '⚡ Snap (Temporary)' : '🖼️ Permanent Post'}
          </div>
          <img src="${item.image_url}" />
          <div class="card-body">
            <p class="caption"><b>You:</b> ${item.caption || 'No caption'}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    loadFeed();
    setInterval(loadFeed, 5000);
  </script>
</body>
</html>
