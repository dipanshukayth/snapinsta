<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snapista</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #000000;
      --accent-snap: #fffc00;
      --accent-insta: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --border: #262626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0a0a0a; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      position: relative;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    /* Screen Views */
    .screen { flex: 1; height: calc(100vh - 60px); overflow-y: auto; display: none; position: relative; }
    .screen.active { display: flex; flex-direction: column; }

    /* Camera View */
    #cameraScreen { position: relative; background: #111; overflow: hidden; }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }
    video.filter-bw { filter: grayscale(100%) contrast(120%); }
    video.filter-vintage { filter: sepia(60%) contrast(110%); }
    video.filter-cyber { filter: hue-rotate(180deg) saturate(180%); }

    /* Top Overlay */
    .camera-top-bar {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .brand-pill {
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }
    .icon-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .camera-side-tools {
      position: absolute;
      top: 70px;
      right: 16px;
      z-index: 10;
    }

    /* Bottom Overlay Controls */
    .camera-bottom-ui {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
      padding: 0 16px;
    }

    .caption-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 6px 14px;
    }
    .caption-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    .mode-selector {
      display: flex;
      background: rgba(0,0,0,0.6);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: #bbb;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #fff;
      color: #000;
    }

    /* Snap Shutter */
    .shutter-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .shutter-core {
      width: 54px;
      height: 54px;
      background: #fffc00;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .shutter-post .shutter-core { background: #fff; }

    /* Feed Screen */
    #feedScreen { background: #000; padding-bottom: 20px; }
    .feed-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.9);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .feed-title {
      font-weight: 800;
      font-size: 20px;
      background: var(--accent-insta);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stories-tray {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; }
    .story-ring {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--accent-insta);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-ring.snap { background: var(--accent-snap); }
    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #222;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .insta-post { border-bottom: 1px solid var(--border); margin-bottom: 10px; }
    .post-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
    .post-user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; }
    .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
    .tag-snap { background: var(--accent-snap); color: #000; }
    .tag-post { background: #333; color: #fff; }
    .post-img { width: 100%; max-height: 450px; object-fit: cover; display: block; }
    .post-body { padding: 10px 14px; font-size: 13px; }

    /* Bottom Nav */
    .bottom-nav {
      height: 60px;
      background: #000;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav-tab {
      background: transparent;
      border: none;
      color: #666;
      font-size: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .nav-tab.active { color: #fff; }
    .nav-tab span { font-size: 11px; }

    #camErrorMsg {
      position: absolute;
      top: 40%;
      left: 20px;
      right: 20px;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <div id="camErrorMsg"></div>

    <!-- CAMERA SCREEN -->
    <div id="cameraScreen" class="screen active">
      <div class="camera-top-bar">
        <div class="brand-pill">Snapista 📸</div>
        <button class="icon-btn" onclick="toggleCamera()"><i class="fa-solid fa-camera-rotate"></i></button>
      </div>

      <div class="camera-side-tools">
        <button class="icon-btn" onclick="cycleFilter()"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
      </div>

      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" style="display:none;"></canvas>

      <div class="camera-bottom-ui">
        <div class="caption-box">
          <input type="text" id="captionInput" placeholder="Add a caption..." />
        </div>

        <div class="mode-selector">
          <button class="mode-btn active" id="btnSnap" onclick="setMode('snap')">⚡ Snap (60s)</button>
          <button class="mode-btn" id="btnPost" onclick="setMode('post')">🖼️ Permanent</button>
        </div>

        <div class="shutter-ring" id="shutterRing" onclick="captureAndShare()">
          <div class="shutter-core"></div>
        </div>
      </div>
    </div>

    <!-- FEED SCREEN -->
    <div id="feedScreen" class="screen">
      <div class="feed-header">
        <div class="feed-title">Snapista</div>
        <i class="fa-regular fa-paper-plane"></i>
      </div>

      <div class="stories-tray">
        <div class="story-item"><div class="story-ring snap"><div class="story-avatar">You</div></div><span>Your Story</span></div>
        <div class="story-item"><div class="story-ring"><div class="story-avatar">Alex</div></div><span>alex</span></div>
        <div class="story-item"><div class="story-ring"><div class="story-avatar">Ria</div></div><span>ria</span></div>
      </div>

      <div id="feedContainer"></div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-nav">
      <button class="nav-tab active" id="tabCamera" onclick="switchScreen('camera')">
        <i class="fa-solid fa-camera"></i>
        <span>Camera</span>
      </button>
      <button class="nav-tab" id="tabFeed" onclick="switchScreen('feed')">
        <i class="fa-solid fa-images"></i>
        <span>Feed</span>
      </button>
    </div>

  </div>

  <script>
    let selectedMode = 'snap';
    let currentFilterIndex = 0;
    const filters = ['', 'filter-bw', 'filter-vintage', 'filter-cyber'];
    let useFrontCamera = true;
    let currentStream = null;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const errBox = document.getElementById('camErrorMsg');

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      try {
        errBox.style.display = 'none';
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        errBox.innerText = "Camera access error: " + err.message + ". Please allow camera permission.";
        errBox.style.display = 'block';
      }
    }

    initCamera();

    function toggleCamera() {
      useFrontCamera = !useFrontCamera;
      video.style.transform = useFrontCamera ? "scaleX(-1)" : "none";
      initCamera();
    }

    function cycleFilter() {
      video.classList.remove(filters[currentFilterIndex]);
      currentFilterIndex = (currentFilterIndex + 1) % filters.length;
      if (filters[currentFilterIndex]) {
        video.classList.add(filters[currentFilterIndex]);
      }
    }

    function setMode(mode) {
      selectedMode = mode;
      document.getElementById('btnSnap').classList.toggle('active', mode === 'snap');
      document.getElementById('btnPost').classList.toggle('active', mode === 'post');
      document.getElementById('shutterRing').classList.toggle('shutter-post', mode === 'post');
    }

    function switchScreen(screen) {
      document.getElementById('cameraScreen').classList.toggle('active', screen === 'camera');
      document.getElementById('feedScreen').classList.toggle('active', screen === 'feed');
      document.getElementById('tabCamera').classList.toggle('active', screen === 'camera');
