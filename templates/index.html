<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snapista</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --snap-yellow: #fffc00;
      --snap-dark: #0f0f10;
      --snap-glass: rgba(18, 18, 22, 0.7);
      --snap-border: rgba(255, 255, 255, 0.18);
      --insta-gradient: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; }

    .app-viewport {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #000;
    }

    .screen { flex: 1; height: calc(100vh - 65px); overflow-y: auto; display: none; position: relative; }
    .screen.active { display: flex; flex-direction: column; }

    /* CAMERA SCREEN */
    #cameraScreen {
      position: relative;
      background: #000;
      overflow: hidden;
      height: 100vh;
    }

    video#videoElement {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
      background: #000;
    }

    /* Flash overlay */
    #screenFlash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      z-index: 99;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    /* Top Bar */
    .snap-top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .snap-badge {
      background: var(--snap-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--snap-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Sidebar tools */
    .snap-sidebar {
      position: absolute;
      top: 70px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .snap-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--snap-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--snap-border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }
    .snap-btn:active { transform: scale(0.9); }
    .snap-btn.active { background: #fff; color: #000; }

    /* Snap Center Text */
    .snap-text-bar {
      position: absolute;
      top: 45%;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      padding: 8px 16px;
      z-index: 15;
    }
    .snap-text-bar input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }

    /* Bottom area */
    .snap-bottom-area {
      position: absolute;
      bottom: 75px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .mode-slider {
      display: flex;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      border: 1px solid var(--snap-border);
      border-radius: 99px;
      padding: 3px;
    }
    .mode-item {
      background: transparent;
      border: none;
      color: #aaa;
      padding: 5px 14px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-item.active { background: #fff; color: #000; }

    .lens-carousel {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 0;
      scrollbar-width: none;
    }
    .lens-carousel::-webkit-scrollbar { display: none; }

    .lens-bubble {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .lens-bubble.active {
      width: 50px;
      height: 50px;
      background: #fff;
      color: #000;
      border: 3px solid var(--snap-yellow);
      box-shadow: 0 0 14px var(--snap-yellow);
    }
    .lens-bubble span { font-size: 8px; font-weight: bold; margin-top: 2px; }

    .shutter-ring {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 5px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .shutter-ring:active { transform: scale(0.92); }
    .shutter-core {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--snap-yellow);
      transition: background 0.2s;
    }
    .post-mode .shutter-core { background: #ffffff; }

    /* Filters */
    .filter-none { filter: none; }
    .filter-bw { filter: grayscale(100%) contrast(120%); }
    .filter-warm { filter: sepia(45%) saturate(140%); }
    .filter-cyber { filter: hue-rotate(185deg) contrast(130%) saturate(180%); }

    /* Preview Overlay */
    #previewOverlay {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    #previewOverlay.visible { display: flex; }
    #previewImage { width: 100%; flex: 1; object-fit: cover; }
    .preview-header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      z-index: 102;
    }
    .preview-footer {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 102;
    }
    .snap-send-btn {
      background: var(--snap-yellow);
      color: #000;
      border: none;
      font-weight: 800;
      font-size: 14px;
      padding: 10px 22px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* FEED */
    #feedScreen { background: var(--snap-dark); padding-bottom: 20px; }
    .insta-nav {
      position: sticky;
      top: 0;
      background: rgba(15, 15, 16, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--snap-border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    .insta-logo {
      font-size: 22px;
      font-weight: 900;
      background: var(--insta-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .insta-stories {
      display: flex;
      gap: 14px;
      padding: 14px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--snap-border);
    }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; }
    .story-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--insta-gradient);
      padding: 2px;
    }
    .story-circle.snap-ring { background: var(--snap-yellow); }
    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #222;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
    }
    .feed-card {
      background: #181920;
      border: 1px solid var(--snap-border);
      border-radius: 16px;
      margin: 14px;
      overflow: hidden;
    }
    .feed-card-header { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .feed-badge { font-size: 10px; padding: 3px 8px; border-radius: 99px; font-weight: 800; }
    .badge-snap { background: var(--snap-yellow); color: #000; }
    .badge-post { background: rgba(255,255,255,0.12); color: #fff; }
    .feed-card-img { width: 100%; max-height: 480px; object-fit: cover; display: block; }
    .feed-actions { padding: 10px 14px; display: flex; gap: 16px; font-size: 20px; }
    .feed-card-caption { padding: 0 14px 12px; font-size: 13px; }

    /* DOCK */
    .snap-dock {
      height: 65px;
      background: rgba(10, 10, 12, 0.95);
      border-top: 1px solid var(--snap-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
    }
    .dock-tab {
      background: transparent;
      border: none;
      color: #666;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .dock-tab.active { color: #fff; }
    .dock-tab span { font-size: 10px; font-weight: 700; }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div id="screenFlash"></div>

    <!-- CAMERA -->
    <div id="cameraScreen" class="screen active">
      <video id="videoElement" autoplay playsinline muted></video>
      <canvas id="offscreenCanvas" style="display:none;"></canvas>

      <div class="snap-top-bar">
        <div class="snap-badge"><i class="fa-solid fa-bolt" style="color:var(--snap-yellow);"></i> Snapista</div>
        <button class="snap-btn" onclick="flipCamera()"><i class="fa-solid fa-camera-rotate"></i></button>
      </div>

      <div class="snap-sidebar">
        <button class="snap-btn" id="btnFlash" onclick="toggleFlash()"><i class="fa-solid fa-bolt"></i></button>
      </div>

      <div class="snap-text-bar">
        <input type="text" id="snapCaption" placeholder="Add Snap Caption..." />
      </div>

      <div class="snap-bottom-area">
        <div class="mode-slider">
          <button class="mode-item active" id="modeSnapBtn" onclick="setPostMode('snap')">⚡ Snap (60s)</button>
          <button class="mode-item" id="modePostBtn" onclick="setPostMode('post')">🖼️ Permanent</button>
        </div>

        <div class="lens-carousel">
          <div class="lens-bubble active" onclick="applyFilter(this, 'filter-none')"><i class="fa-solid fa-ban"></i><span>Normal</span></div>
          <div class="lens-bubble" onclick="applyFilter(this, 'filter-warm')"><i class="fa-solid fa-sun"></i><span>Warm</span></div>
          <div class="lens-bubble" onclick="applyFilter(this, 'filter-cyber')"><i class="fa-solid fa-bolt"></i><span>Cyber</span></div>
          <div class="lens-bubble" onclick="applyFilter(this, 'filter-bw')"><i class="fa-solid fa-moon"></i><span>B&W</span></div>
        </div>

        <div class="shutter-ring" id="shutterRing" onclick="takeSnapshot()">
          <div class="shutter-core"></div>
        </div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div id="previewOverlay">
      <div class="preview-header">
        <button class="snap-btn" onclick="closePreview()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <img id="previewImage" alt="Snap preview" />
      <div class="preview-footer">
        <div class="snap-badge" id="previewBadge">60s Snap</div>
        <button class="snap-send-btn" onclick="sendSnap()">Send To <i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

    <!-- FEED -->
    <div id="feedScreen" class="screen">
      <div class="insta-nav">
        <div class="insta-logo">Snapista</div>
        <i class="fa-regular fa-paper-plane"></i>
      </div>

      <div class="insta-stories">
        <div class="story-item">
          <div class="story-circle snap-ring"><div class="story-avatar">You</div></div>
          <span>Your Snap</span>
        </div>
        <div class="story-item">
          <div class="story-circle"><div class="story-avatar">alex</div></div>
          <span>alex</span>
        </div>
      </div>

      <div id="feedStream"></div>
    </div>

    <!-- DOCK -->
    <div class="snap-dock">
      <button class="dock-tab active" id="tabNavCam" onclick="switchTab('camera')">
        <i class="fa-solid fa-camera"></i>
        <span>Camera</span>
      </button>
      <button class="dock-tab" id="tabNavFeed" onclick="switchTab('feed')">
        <i class="fa-solid fa-images"></i>
        <span>Feed</span>
      </button>
    </div>
  </div>

  <script>
    let appMode = 'snap';
    let currentFacing = 'user';
    let activeFilter = 'filter-none';
    let flashOn = false;
    let currentStream = null;
    let pendingBlobUrl = null;

    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('offscreenCanvas');

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing },
          audio: false
        });
        currentStream = stream;
        video.srcObject = stream;
        video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
        video.onloadedmetadata = () => {
          video.play().catch(e => console.log(e));
        };
      } catch (err) {
        console.warn("Direct stream failed, trying fallback:", err);
        try {
          const fallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          currentStream = fallback;
          video.srcObject = fallback;
          video.onloadedmetadata = () => { video.play(); };
        } catch (e) {
          alert("Camera block hai! Please browser URL bar me camera icon par allow karein.");
        }
      }
    }

    // Auto-boot on load
    window.addEventListener('DOMContentLoaded', initCamera);

    function flipCamera() {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      initCamera();
    }

    function toggleFlash() {
      flashOn = !flashOn;
      document.getElementById('btnFlash').classList.toggle('active', flashOn);
    }

    function applyFilter(el, filterClass) {
      document.querySelectorAll('.lens-bubble').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      video.className = filterClass;
      activeFilter = filterClass;
    }

    function setPostMode(mode) {
      appMode = mode;
      document.getElementById('modeSnapBtn').classList.toggle('active', mode === 'snap');
      document.getElementById('modePostBtn').classList.toggle('active', mode === 'post');
      document.getElementById('shutterRing').parentElement.classList.toggle('post-mode', mode === 'post');
    }

    function switchTab(t) {
      document.getElementById('cameraScreen').classList.toggle('active', t === 'camera');
      document.getElementById('feedScreen').classList.toggle('active', t === 'feed');
      document.getElementById('tabNavCam').classList.toggle('active', t === 'camera');
      document.getElementById('tabNavFeed').classList.toggle('active', t === 'feed');
      if (t === 'feed') fetchFeed();
    }

    function takeSnapshot() {
      if (flashOn) {
        const flash = document.getElementById('screenFlash');
        flash.style.opacity = '1';
        setTimeout(() => { flash.style.opacity = '0'; }, 150);
      }

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');

      if (currentFacing === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      if (activeFilter === 'filter-bw') ctx.filter = 'grayscale(100%) contrast(120%)';
      else if (activeFilter === 'filter-warm') ctx.filter = 'sepia(45%) saturate(140%)';
      else if (activeFilter === 'filter-cyber') ctx.filter = 'hue-rotate(185deg) contrast(130%) saturate(180%)';

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const cap = document.getElementById('snapCaption').value.trim();
      if (cap) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const barH = 44;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(0, (canvas.height / 2) - (barH / 2), canvas.width, barH);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(cap, canvas.width / 2, canvas.height / 2);
      }

      pendingBlobUrl = canvas.toDataURL('image/jpeg', 0.85);
      document.getElementById('previewImage').src = pendingBlobUrl;
      document.getElementById('previewBadge').innerText = appMode === 'snap' ? '⚡ 60s Snap' : '🖼️ Permanent Post';
      document.getElementById('previewOverlay').classList.add('visible');
    }

    function closePreview() {
      document.getElementById('previewOverlay').classList.remove('visible');
      pendingBlobUrl = null;
    }

    async function sendSnap() {
      if (!pendingBlobUrl) return;
      const cap = document.getElementById('snapCaption').value.trim();
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: pendingBlobUrl, type: appMode, caption: cap })
      });
      if (res.ok) {
        document.getElementById('snapCaption').value = '';
        closePreview();
        switchTab('feed');
      }
    }

    async function fetchFeed() {
      const res = await fetch('/api/feed');
      const posts = await res.json();
      const container = document.getElementById('feedStream');
      container.innerHTML = '';

      if (!posts || posts.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:50px 20px; color:#777; font-size:14px;">No posts yet. Snap something!</div>';
        return;
      }

      posts.forEach(p => {
        const isSnap = p.type === 'snap';
        const card = document.createElement('div');
        card.className = 'feed-card';
        card.innerHTML = `
          <div class="feed-card-header">
            <span>👻 you</span>
            <span class="feed-badge ${isSnap ? 'badge-snap' : 'badge-post'}">${isSnap ? '⚡ 60s Snap' : 'Post'}</span>
          </div>
          <img class="feed-card-img" src="${p.image_url}" />
          <div class="feed-actions">
            <i class="fa-regular fa-heart" onclick="this.classList.toggle('fa-solid'); this.classList.toggle('fa-regular');"></i>
          </div>
          <div class="feed-card-caption">
            <b>you</b> ${p.caption || ''}
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
