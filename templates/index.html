<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snapista</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #14161d;
      --accent-snap: #fffc00;
      --accent-insta: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-dim: #9aa0a6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    body { background: #000; color: var(--text); height: 100vh; overflow: hidden; display: flex; justify-content: center; }

    .app-viewport {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .screen { flex: 1; height: calc(100vh - 65px); overflow-y: auto; display: none; position: relative; }
    .screen.active { display: flex; flex-direction: column; }

    /* CAMERA SCREEN (Snapchat Style) */
    #cameraScreen {
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .video-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
      transition: filter 0.25s ease;
    }

    /* Filters */
    .filter-bw { filter: grayscale(100%) contrast(115%); }
    .filter-warm { filter: sepia(40%) saturate(140%) contrast(105%); }
    .filter-cyber { filter: hue-rotate(190deg) saturate(180%); }

    /* Glass overlay controls */
    .top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .glass-badge {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .glass-btn {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: transform 0.15s;
    }
    .glass-btn:active { transform: scale(0.9); }

    .camera-side-bar {
      position: absolute;
      top: 70px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .camera-bottom-deck {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 20;
      padding: 0 16px;
    }

    .caption-pill {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 14px;
    }
    .caption-pill input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .mode-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      padding: 3px;
      gap: 4px;
    }
    .mode-tab {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-tab.active {
      background: #fff;
      color: #000;
      box-shadow: 0 4px 12px rgba(255,255,255,0.2);
    }

    /* Shutter button */
    .snap-shutter {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      transition: transform 0.15s ease;
    }
    .snap-shutter:active { transform: scale(0.92); }
    .snap-shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--accent-snap);
      transition: background 0.2s;
    }
    .snap-shutter.post-mode .snap-shutter-inner {
      background: #ffffff;
    }

    /* FEED SCREEN (Instagram Style) */
    #feedScreen {
      background: var(--bg);
      padding-bottom: 20px;
    }

    .insta-nav {
      position: sticky;
      top: 0;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    .insta-brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--accent-insta);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Stories row */
    .story-tray {
      display: flex;
      gap: 14px;
      padding: 14px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .story-tray::-webkit-scrollbar { display: none; }
    .story-bubble { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); }
    .story-ring-wrap {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--accent-insta);
      padding: 2.5px;
    }
    .story-ring-wrap.snap-glow { background: var(--accent-snap); }
    .story-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #1e212b;
      border: 2px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
    }

    /* Post Card */
    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin: 14px 14px;
      overflow: hidden;
    }
    .post-header-bar {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .post-author { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
    .avatar-mini {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #2b303c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .chip {
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .chip-snap { background: var(--accent-snap); color: #000; }
    .chip-post { background: rgba(255,255,255,0.1); color: #fff; }

    .post-media {
      width: 100%;
      max-height: 480px;
      background: #000;
      display: flex;
      justify-content: center;
    }
    .post-media img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .post-toolbar {
      padding: 10px 14px;
      display: flex;
      gap: 16px;
      font-size: 20px;
    }
    .post-toolbar i { cursor: pointer; transition: transform 0.15s ease; }
    .post-toolbar i:active { transform: scale(1.2); }
    .post-toolbar .fa-heart.liked { color: #fe2c55; }

    .post-details {
      padding: 0 14px 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    .post-details b { margin-right: 6px; }

    /* Bottom Dock Bar */
    .dock-nav {
      height: 65px;
      background: rgba(11, 12, 16, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }
    .dock-item {
      background: transparent;
      border: none;
      color: #616672;
      font-size: 21px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: color 0.2s;
    }
    .dock-item.active { color: #ffffff; }
    .dock-item span { font-size: 10px; font-weight: 600; }

    #fallbackNotice {
      position: absolute;
      top: 50%;
      left: 20px;
      right: 20px;
      transform: translateY(-50%);
      background: rgba(20, 20, 25, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      z-index: 100;
      display: none;
    }
    #fallbackNotice button {
      margin-top: 12px;
      padding: 8px 18px;
      border-radius: 8px;
      background: #fff;
      color: #000;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-viewport">

    <div id="fallbackNotice">
      <p style="font-size: 14px; margin-bottom: 6px;">📸 Camera permission required</p>
      <p style="font-size: 12px; color: #8e8e8e;">Camera access block hai ya start nahi ho paya.</p>
      <button onclick="startCamera()">Retry Camera</button>
    </div>

    <!-- CAMERA SCREEN -->
    <div id="cameraScreen" class="screen active">
      <div class="top-bar">
        <div class="glass-badge"><i class="fa-solid fa-bolt" style="color: var(--accent-snap);"></i> Snapista</div>
        <button class="glass-btn" onclick="flipCam()"><i class="fa-solid fa-arrows-rotate"></i></button>
      </div>

      <div class="camera-side-bar">
        <button class="glass-btn" onclick="cycleFilters()"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
      </div>

      <div class="video-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="hiddenCanvas" style="display:none;"></canvas>
      </div>

      <div class="camera-bottom-deck">
        <div class="caption-pill">
          <input type="text" id="captionText" placeholder="Add a caption..." />
        </div>

        <div class="mode-switch">
          <button class="mode-tab active" id="tabSnap" onclick="selectMode('snap')">⚡ Snap (60s)</button>
          <button class="mode-tab" id="tabPost" onclick="selectMode('post')">🖼️ Post</button>
        </div>

        <div class="snap-shutter" id="shutterBtn" onclick="takeSnapshot()">
          <div class="snap-shutter-inner"></div>
        </div>
      </div>
    </div>

    <!-- FEED SCREEN -->
    <div id="feedScreen" class="screen">
      <div class="insta-nav">
        <div class="insta-brand">Snapista</div>
        <i class="fa-regular fa-paper-plane" style="font-size: 20px;"></i>
      </div>

      <div class="story-tray">
        <div class="story-bubble">
          <div class="story-ring-wrap snap-glow"><div class="story-avatar-img">You</div></div>
          <span>Your Snap</span>
        </div>
        <div class="story-bubble">
          <div class="story-ring-wrap"><div class="story-avatar-img">alex</div></div>
          <span>alex</span>
        </div>
        <div class="story-bubble">
          <div class="story-ring-wrap"><div class="story-avatar-img">priya</div></div>
          <span>priya</span>
        </div>
        <div class="story-bubble">
          <div class="story-ring-wrap"><div class="story-avatar-img">sam</div></div>
          <span>sam</span>
        </div>
      </div>

      <div id="feedList"></div>
    </div>

    <!-- BOTTOM DOCK -->
    <div class="dock-nav">
      <button class="dock-item active" id="dockCam" onclick="gotoScreen('camera')">
        <i class="fa-solid fa-camera"></i>
        <span>Camera</span>
      </button>
      <button class="dock-item" id="dockFeed" onclick="gotoScreen('feed')">
        <i class="fa-solid fa-shapes"></i>
        <span>Feed</span>
      </button>
    </div>

  </div>

  <script>
    let activeMode = 'snap';
    let filterIndex = 0;
    const filterStyles = ['', 'filter-bw', 'filter-warm', 'filter-cyber'];
    let facing = 'user';
    let activeStream = null;

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hiddenCanvas');
    const notice = document.getElementById('fallbackNotice');

    async function startCamera() {
      notice.style.display = 'none';

      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
      }

      try {
        // Universal compatible constraints
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing },
          audio: false
        });
        activeStream = stream;
        video.srcObject = stream;
        video.style.transform = facing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
        await video.play();
      } catch (e) {
        console.warn("Direct stream failed, trying fallback:", e);
        try {
          // Absolute basic fallback
          const basicStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          activeStream = basicStream;
          video.srcObject = basicStream;
          await video.play();
        } catch (err2) {
          notice.style.display = 'block';
        }
      }
    }

    startCamera();

    function flipCam() {
      facing = (facing === 'user') ? 'environment' : 'user';
      startCamera();
    }

    function cycleFilters() {
      video.classList.remove(filterStyles[filterIndex]);
      filterIndex = (filterIndex + 1) % filterStyles.length;
      if (filterStyles[filterIndex]) {
        video.classList.add(filterStyles[filterIndex]);
      }
    }

    function selectMode(m) {
      activeMode = m;
      document.getElementById('tabSnap').classList.toggle('active', m === 'snap');
      document.getElementById('tabPost').classList.toggle('active', m === 'post');
      document.getElementById('shutterBtn').classList.toggle('post-mode', m === 'post');
    }

    function gotoScreen(s) {
      document.getElementById('cameraScreen').classList.toggle('active', s === 'camera');
      document.getElementById('feedScreen').classList.toggle('active', s === 'feed');
      document.getElementById('dockCam').classList.toggle('active', s === 'camera');
      document.getElementById('dockFeed').classList.toggle('active', s === 'feed');
      if (s === 'feed') renderFeed();
    }

    async function takeSnapshot() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');

      if (facing === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      if (filterStyles[filterIndex] === 'filter-bw') {
        ctx.filter = 'grayscale(100%) contrast(115%)';
      } else if (filterStyles[filterIndex] === 'filter-warm') {
        ctx.filter = 'sepia(40%) saturate(140%) contrast(105%)';
      } else if (filterStyles[filterIndex] === 'filter-cyber') {
        ctx.filter = 'hue-rotate(190deg) saturate(180%)';
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      const caption = document.getElementById('captionText').value;

      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl, type: activeMode, caption: caption })
      });

      if (res.ok) {
        document.getElementById('captionText').value = '';
        gotoScreen('feed');
      }
    }

    async function renderFeed() {
      const res = await fetch('/api/feed');
      const items = await res.json();
      const list = document.getElementById('feedList');
      list.innerHTML = '';

      if (!items || items.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding: 50px 20px; color: #666; font-size: 14px;">No posts yet.<br>Click the camera tab to capture something!</div>';
        return;
      }

      items.forEach(it => {
        const isSnap = it.type === 'snap';
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
          <div class="post-header-bar">
            <div class="post-author">
              <div class="avatar-mini">✨</div>
              <span>snapista_user</span>
            </div>
            <span class="chip ${isSnap ? 'chip-snap' : 'chip-post'}">${isSnap ? '⚡ 60s Snap' : 'Post'}</span>
          </div>
          <div class="post-media">
            <img src="${it.image_url}" />
          </div>
          <div class="post-toolbar">
            <i class="fa-regular fa-heart" onclick="likePost(this)"></i>
            <i class="fa-regular fa-comment"></i>
            <i class="fa-regular fa-paper-plane"></i>
          </div>
          <div class="post-details">
            <p><b>snapista_user</b> ${it.caption || 'Captured with Snapista'}</p>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function likePost(el) {
      el.classList.toggle('fa-solid');
      el.classList.toggle('fa-regular');
      el.classList.toggle('liked');
    }

    setInterval(() => {
      if (document.getElementById('feedScreen').classList.contains('active')) {
        renderFeed();
      }
    }, 5000);
  </script>
</body>
</html>
