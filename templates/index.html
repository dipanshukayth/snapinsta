<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snapista</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; }

    .app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #000;
    }

    .view { flex: 1; height: calc(100vh - 60px); position: relative; overflow: hidden; display: none; }
    .view.active { display: flex; flex-direction: column; }

    /* ================= CAMERA VIEW ================= */
    #camView { background: #111; position: relative; }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    /* Filters */
    .filter-none { filter: none; }
    .filter-golden { filter: sepia(35%) saturate(150%) brightness(105%); }
    .filter-cyber { filter: hue-rotate(185deg) contrast(130%) saturate(180%); }
    .filter-noir { filter: grayscale(100%) contrast(130%); }

    /* Top Elements */
    .top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .badge {
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge i { color: #fffc00; }
    .btn-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
