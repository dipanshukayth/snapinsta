<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social — Connect with friends</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fafafa;
      color: #171717;
      font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    .topbar {
      height: 64px; background: #fff; border-bottom: 1px solid #e8e8e8;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 max(5%, calc((100% - 1100px)/2)); position: sticky; top: 0; z-index: 5;
    }
    .brand { font-size: 25px; font-weight: 800; letter-spacing: -1px; }
    .search { width: 240px; padding: 10px 14px; border: 0; border-radius: 10px; background: #f2f2f2; }
    .nav { display: flex; gap: 18px; font-size: 21px; }
    .layout { max-width: 1000px; margin: 28px auto; padding: 0 18px; display: grid; grid-template-columns: minmax(0, 620px) 300px; gap: 38px; }
    .stories, .post, .profile-card { background: white; border: 1px solid #e8e8e8; border-radius: 14px; }
    .stories { padding: 16px; display: flex; gap: 16px; overflow-x: auto; margin-bottom: 20px; }
    .story { flex: 0 0 62px; text-align: center; font-size: 12px; }
    .ring { width: 58px; height: 58px; padding: 3px; margin: auto auto 6px; border-radius: 50%; background: linear-gradient(45deg,#ffb900,#ff315f,#a32cff); }
    .ring img { width: 100%; height: 100%; object-fit: cover; border: 2px solid white; border-radius: 50%; }
    .post { margin-bottom: 22px; overflow: hidden; }
    .post-head { display: flex; align-items: center; gap: 10px; padding: 13px 15px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    .username { font-weight: 700; }
    .place { color: #777; font-size: 12px; }
    .more { margin-left: auto; border: 0; background: none; font-size: 22px; }
    .post-image { display: block; width: 100%; max-height: 650px; object-fit: cover; background: #eee; }
    .actions { display: flex; gap: 14px; padding: 12px 15px 2px; }
    .icon-btn { border: 0; background: none; padding: 0; font-size: 25px; }
    .save { margin-left: auto; }
    .likes, .caption, .comments, .date { padding: 0 15px; }
    .likes { font-weight: 700; margin: 5px 0; }
    .caption { margin: 5px 0; }
    .comments { color: #777; margin: 5px 0; }
    .date { color: #999; font-size: 11px; padding-bottom: 14px; }
    .profile-card { border: 0; background: transparent; position: sticky; top: 85px; height: fit-content; }
    .profile-row { display: flex; align-items: center; gap: 12px; }
    .profile-row .avatar { width: 48px; height: 48px; }
    .switch { margin-left: auto; color: #1687e8; border: 0; background: none; font-weight: 700; }
    .suggest-title { margin-top: 26px; color: #777; font-weight: 700; }
    .suggestion { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
    .suggestion .avatar { width: 34px; height: 34px; }
    .follow { margin-left: auto; border: 0; color: #1687e8; background: none; font-weight: 700; }
    @media (max-width: 800px) {
      .layout { display: block; max-width: 620px; margin-top: 16px; }
      .profile-card { display: none; }
      .search { width: min(38vw, 220px); }
    }
    @media (max-width: 480px) {
      .topbar { height: 56px; padding: 0 14px; }
      .search { display: none; }
      .layout { padding: 0; margin: 10px auto; }
      .stories, .post { border-radius: 0; border-left: 0; border-right: 0; }
      .post-image { max-height: 75vh; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">social.</div>
    <input class="search" placeholder="Search" aria-label="Search" />
    <nav class="nav" aria-label="Main navigation">
      <span title="Home">⌂</span><span title="Messages">✉</span>
      <span title="Create">＋</span><span title="Explore">⌕</span><span title="Profile">◉</span>
    </nav>
  </header>

  <main class="layout">
    <section>
      <div class="stories" id="stories"></div>
      <div id="feed"></div>
    </section>
    <aside class="profile-card">
      <div class="profile-row">
        <img class="avatar" src="https://i.pravatar.cc/100?img=12" alt="" />
        <div><div class="username">your_username</div><div class="place">Your profile</div></div>
        <button class="switch">Switch</button>
      </div>
      <div class="suggest-title">Suggestions for you</div>
      <div id="suggestions"></div>
    </aside>
  </main>

  <script>
    const people = [
      ["maya.jpg", "maya", 47], ["arjun.jpg", "arjun", 12], ["zoya.jpg", "zoya", 44],
      ["rohan.jpg", "rohan", 33], ["isha.jpg", "isha", 5], ["kabir.jpg", "kabir", 60]
    ];

    const photo = (id) => `https://images.unsplash.com/${id}?auto=format&fit=crop&w=1000&q=85`;
    const posts = [
      { user: "maya", avatar: 47, place: "Goa, India", image: "photo-1519046904884-53103b34b206", likes: "2,481", caption: "Somewhere between the sea and the sunset 🌅", comments: 38 },
      { user: "arjun", avatar: 12, place: "Jaipur, India", image: "photo-1477587458883-47145ed94245", likes: "1,206", caption: "A little colour for the feed ✨", comments: 21 },
      { user: "zoya", avatar: 44, place: "Mumbai, India", image: "photo-1519608487953-e999c86e7455", likes: "3,902", caption: "Night walks hit different.", comments: 64 }
    ];

    document.querySelector("#stories").innerHTML = `
      <div class="story"><div class="ring"><img src="https://i.pravatar.cc/100?img=12" alt=""></div>Your story</div>
      ${people.map(([_, name, id]) => `<div class="story"><div class="ring"><img src="https://i.pravatar.cc/100?img=${id}" alt=""></div>${name}</div>`).join("")}
    `;

    document.querySelector("#feed").innerHTML = posts.map((post, i) => `
      <article class="post">
        <div class="post-head">
          <img class="avatar" src="https://i.pravatar.cc/100?img=${post.avatar}" alt="">
          <div><div class="username">${post.user}</div><div class="place">${post.place}</div></div>
          <button class="more" aria-label="More options">···</button>
        </div>
        <img class="post-image" src="${photo(post.image)}" alt="A travel photo from ${post.place}">
        <div class="actions">
          <button class="icon-btn like" aria-label="Like post">♡</button>
          <button class="icon-btn" aria-label="Comment">♧</button>
          <button class="icon-btn" aria-label="Share">➤</button>
          <button class="icon-btn save" aria-label="Save post">♧</button>
        </div>
        <div class="likes">${post.likes} likes</div>
        <p class="caption"><strong>${post.user}</strong> ${post.caption}</p>
        <div class="comments">View all ${post.comments} comments</div>
        <div class="date">${i + 1} days ago</div>
      </article>
    `).join("");

    document.querySelector("#suggestions").innerHTML = people.slice(1, 4).map(([_, name, id]) => `
      <div class="suggestion">
        <img class="avatar" src="https://i.pravatar.cc/100?img=${id}" alt="">
        <div><div class="username">${name}</div><div class="place">Suggested for you</div></div>
        <button class="follow">Follow</button>
      </div>
    `).join("");

    document.querySelectorAll(".like").forEach(button => {
      button.addEventListener("click", () => {
        const liked = button.classList.toggle("liked");
        button.textContent = liked ? "♥" : "♡";
        button.style.color = liked ? "#ed4956" : "inherit";
      });
    });
  </script>
</body>
</html>
